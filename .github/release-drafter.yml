    labels:
      - feature

  - title: 🐛 Bug Fixes
    labels:
      - bug

  - title: ⚡ Enhancements
    labels:
      - enhancement

  - title: 🔒 Security
    labels:
      - security

change-template: '- $TITLE (#$NUMBER)'

template: |
  ## What's Changed

  $CHANGES